<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a12">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Alya Music</title>
<style>
:root{--surf:#14141f;--surf2:#1a1a26;--nav:rgba(12,12,22,.96);--modal:#181826;--inp:#101019;--toastbg:#262638;--minibg:rgba(26,26,42,.95);--bg:#0a0a12;--card:rgba(255,255,255,.06);--card2:rgba(255,255,255,.1);--line:rgba(255,255,255,.1);--ink:#f5f5fb;--mut:rgba(245,245,251,.62);--a:#8b5cf6;--b:#22d3ee;--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);background:radial-gradient(800px 420px at 0% -10%,color-mix(in srgb,var(--a) 22%,transparent),transparent),radial-gradient(700px 420px at 100% 0%,color-mix(in srgb,var(--b) 13%,transparent),transparent),var(--bg);background-attachment:fixed;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
img{display:block}
.ic{display:inline-flex}
.app{display:grid;grid-template-columns:minmax(0,1fr)}
.side{display:none}
.main{padding:max(14px,env(safe-area-inset-top)) 16px calc(150px + var(--sb));max-width:900px;width:100%;margin:0 auto}
h1{font-size:24px;letter-spacing:-.02em}
h2{font-size:17px;letter-spacing:-.01em}
.mut{color:var(--mut);font-size:13px}
/* navigasi */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;padding-bottom:var(--sb);background:var(--nav);border-top:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;background:none;border:none;color:var(--mut);font-size:11px;font-weight:600}
.nb.on{color:var(--ink)}.nb.on .ic{color:var(--b)}
.side .nb{flex:none;flex-direction:row;gap:12px;padding:12px 14px;border-radius:14px;font-size:14px;justify-content:flex-start}
.side .nb.on{background:var(--card2)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;padding:4px 6px 18px}
.brand img{width:38px;height:38px;border-radius:11px}
/* beranda */
.hhead{display:flex;align-items:center;gap:14px;margin:6px 0 14px}
.hhead img{width:58px;height:58px;border-radius:18px;border:2px solid var(--card2);flex:none}
.sbar{display:flex;align-items:center;gap:10px;width:100%;padding:13px 16px;border-radius:16px;background:var(--surf);border:1px solid var(--line);color:var(--mut);font-size:15px;text-align:left;margin-bottom:16px}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:18px;min-height:168px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;border:1px solid var(--line);background:linear-gradient(135deg,#2a1f55,#0f3b52);margin-bottom:16px}
.hero .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.4;filter:blur(2px)}
.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 10%,rgba(10,10,18,.85))}
.hero>*:not(.bg){position:relative;z-index:1}
.hero .k{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--b)}
.hero .t{font-size:20px;font-weight:800;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pbtn{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;margin-top:6px;padding:10px 20px;border:none;border-radius:99px;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font-weight:700;font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar,.rail::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 15px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600}
.chip:active{transform:scale(.95)}
.sec{margin:22px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.sec button{background:none;border:none;color:var(--b);font-size:13px;font-weight:600}
.rail{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity;scrollbar-width:none}
.card{flex:none;width:142px;text-align:left;background:none;border:none;scroll-snap-align:start}
.card img,.card .sk,.pl .cv{width:142px;height:142px;border-radius:16px;object-fit:cover;background:var(--surf2)}
.ct{font-size:13px;font-weight:600;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ca{font-size:12px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now .ct,.now .rt{color:var(--b)}
.sk{background:linear-gradient(90deg,var(--surf),var(--surf2),var(--surf));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
/* daftar lagu */
.list{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:12px;padding:7px;border-radius:14px;background:var(--card);border:1px solid transparent;cursor:pointer}
.row:hover,.row.now{border-color:var(--line)}
.row img{width:84px;height:48px;border-radius:9px;object-fit:cover;flex:none;background:var(--surf2)}
.rb{flex:1;min-width:0}
.rt{font-size:14px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rs{font-size:12px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:12px;border:none;background:none;display:grid;place-items:center;flex:none;color:var(--mut)}
.ib:active{transform:scale(.9)}
.ib.on{color:#ff5d8f}
.msg{color:var(--mut);font-size:13px;padding:26px 6px;text-align:center;line-height:1.6}
/* cari */
.sform{display:flex;gap:8px;position:sticky;top:0;z-index:5;padding:10px 0 12px;background:linear-gradient(var(--bg) 80%,transparent)}
.sform input{flex:1;min-width:0;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font-size:16px}
.sform input:focus{outline:2px solid var(--b);outline-offset:1px}
.sform button{padding:0 20px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font-weight:700}
/* playlist */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.pl{background:none;border:none;text-align:left}
.pl .cv,.dcv{display:grid;grid-template-columns:1fr 1fr;overflow:hidden;position:relative;width:100%;aspect-ratio:1/1;height:auto;border-radius:16px;background:linear-gradient(135deg,#2a1f55,#0f3b52)}
.cv img,.dcv img{width:100%;height:100%;object-fit:cover}
.cv .one,.dcv .one{grid-column:1/-1;grid-row:1/-1}
.cv .em,.dcv .em{grid-column:1/-1;grid-row:1/-1;display:grid;place-items:center;color:rgba(255,255,255,.7)}
.dhead{display:flex;gap:16px;align-items:flex-end;margin:6px 0 16px}
.dcv{width:132px;flex:none}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 14px}
.acts .pbtn{margin:0}
.sbtn{padding:10px 16px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:none;color:var(--mut);font-size:13px;padding:6px 0}
/* pemutar */
.stage{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;transform:translateY(105%);visibility:hidden;transition:transform .3s ease,visibility 0s .3s}
body.sheet .stage{transform:none;visibility:visible;transition:transform .3s ease}
.sh{flex:none;display:flex;align-items:center;gap:6px;padding:max(6px,env(safe-area-inset-top)) 10px 4px}
.shl{flex:1;font-size:13px;font-weight:600;color:var(--mut);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg{padding:7px 11px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:11.5px;font-weight:600;color:var(--mut)}
.tg.on{background:linear-gradient(135deg,var(--a),var(--b));border-color:transparent;color:#fff}
.fw{position:relative;flex:1;min-height:0}
.stage iframe{width:100%;height:100%;border:0;background:transparent;display:block}
.ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px;color:var(--mut);font-size:14px;line-height:1.6}
.ph.hide{display:none}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--b);animation:r 1s linear infinite;margin:0 auto 12px}
@keyframes r{to{transform:rotate(360deg)}}
.mini{position:fixed;left:8px;right:8px;bottom:calc(66px + var(--sb));z-index:24;display:flex;align-items:center;gap:2px;padding:7px;border-radius:18px;background:var(--minibg);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.mini[hidden]{display:none}
.mo{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:none;text-align:left}
.mo img{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none;background:var(--surf2)}
.mt{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ma{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .ib{color:var(--ink);width:42px;height:42px}
.mini .main-b{background:linear-gradient(135deg,var(--a),var(--b));color:#fff}
/* modal + toast */
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.mbox{width:100%;max-width:480px;max-height:80vh;overflow-y:auto;background:var(--modal);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:16px 16px calc(16px + var(--sb))}
.mh{font-weight:700;font-size:15px;margin:2px 4px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act{display:flex;align-items:center;gap:12px;width:100%;padding:14px 10px;background:none;border:none;border-radius:12px;text-align:left;font-size:15px}
.act:active{background:var(--card2)}
.act.danger{color:#ff7a8a}
.minput{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--inp);color:var(--ink);font-size:16px;margin-bottom:12px}
.brow{display:flex;gap:8px;justify-content:flex-end}
.brow button{padding:11px 20px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600}
.brow .go{background:linear-gradient(135deg,var(--a),var(--b));border-color:transparent;color:#fff}
.toast{position:fixed;left:50%;bottom:calc(140px + var(--sb));transform:translate(-50%,20px);background:var(--toastbg);border:1px solid var(--line);padding:10px 18px;border-radius:99px;font-size:13px;z-index:70;opacity:0;pointer-events:none;transition:.25s;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.upd{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:linear-gradient(135deg,rgba(139,92,246,.28),rgba(34,211,238,.18));border:1px solid var(--line);margin-bottom:14px}
.upd>div{flex:1;min-width:0}
.set{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0}
.set h3{font-size:15px;margin-bottom:8px}
.set .mut{margin:6px 0;line-height:1.55}
.set .acts{margin:10px 0 0}
.set .minput{margin:10px 0}
textarea.minput{resize:vertical}
.qrow{display:flex;align-items:center}
.qrow .act{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.qrow.cur .act{color:var(--b);font-weight:700}

/* beranda baru + teman */
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 2px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:11.5px;font-weight:600}
.tile b{font-size:22px;line-height:1}.tile:active{transform:scale(.95)}
.qp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qp button{display:flex;align-items:center;gap:8px;min-width:0;padding:0 8px 0 0;border-radius:10px;background:var(--card);border:1px solid transparent;text-align:left;overflow:hidden}
.qp img{width:48px;height:48px;object-fit:cover;flex:none}.qp span{font-size:12px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gens{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gen{padding:18px 14px;border-radius:16px;text-align:left;font-weight:800;font-size:15px;color:#fff;min-height:72px;border:none}
.arts{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px}.arts::-webkit-scrollbar{display:none}
.art{flex:none;width:84px;background:none;border:none;text-align:center}.art img{width:84px;height:84px;border-radius:50%;object-fit:cover;background:var(--surf2)}
.art div{font-size:12px;font-weight:600;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,var(--a),var(--b));color:#fff}
.fr{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.fr .rb{flex:1;min-width:0}
.promo{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:16px;border-radius:18px;background:linear-gradient(135deg,rgba(139,92,246,.28),rgba(34,211,238,.16));border:1px solid var(--line);margin:18px 0 4px}
.gbtn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:99px;border:none;background:#fff;color:#222;font-weight:700;font-size:14px}
.code{font-size:26px;font-weight:800;letter-spacing:.18em;color:var(--b);margin:4px 0}

.htop{display:flex;align-items:center;gap:10px;margin:2px 0 16px}
.abtn{flex:none;background:none;border:none;padding:0;display:grid;place-items:center}
.ph0{width:34px;height:34px;background:var(--card2)!important;color:var(--ink)!important}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
h1.gr{font-size:22px;margin:0 0 12px}
.qp button{padding:0 8px 0 0;border-radius:6px;background:var(--card2);gap:10px}
.qp img{width:56px;height:56px}
.qp .cv,.qp .fv{width:56px;height:56px;flex:none;border-radius:0}
.qp .cv{display:grid;grid-template-columns:1fr 1fr;overflow:hidden;background:var(--surf2)}
.qp .fv{display:grid;place-items:center;background:linear-gradient(135deg,#6d28d9,#22d3ee);color:#fff}
.qp span:not(.fv){font-size:13px;font-weight:700}
.sec{margin:26px 0 12px}.sec h2{font-size:20px;font-weight:800}

.mix{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;padding:16px;margin:14px 0 4px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--a),var(--b));color:#fff}
.mix b{font-size:18px}.mix span{font-size:12.5px;opacity:.9}

.stage{--bg:#0a0a12;--ink:#f5f5fb;--mut:rgba(245,245,251,.62);--card:rgba(255,255,255,.06);--card2:rgba(255,255,255,.1);--line:rgba(255,255,255,.1);background:#0a0a12}
.toast{color:#fff}
.nb .ic{padding:3px 18px;border-radius:99px;transition:background .2s}
.nb.on .ic{background:color-mix(in srgb,var(--a) 28%,transparent)}
.side .nb .ic{padding:0}
.pcard{position:relative;border-radius:22px;padding:20px 16px 14px;margin:4px 0 8px;background:var(--card);background:linear-gradient(135deg,color-mix(in srgb,var(--a) 38%,var(--surf)),color-mix(in srgb,var(--b) 24%,var(--surf)));border:1px solid var(--line)}
.ptop{display:flex;align-items:center;gap:14px}.ptop h1{font-size:22px}
.ptop>img{width:72px;height:72px;border-radius:50%;object-fit:cover;flex:none;border:2px solid var(--card2)}
.pst{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.pst div{text-align:center}.pst b{display:block;font-size:19px}.pst span{font-size:11px;color:var(--mut)}
.sgt{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:22px 6px 8px}
.sgrp{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.srow{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;background:none;border:none;border-bottom:1px solid var(--line);text-align:left}
.srow:last-child{border-bottom:none}.srow:active{background:var(--card2)}
.st{flex:1;min-width:0}.st b{display:block;font-size:14.5px;font-weight:600}.st span{display:block;font-size:12px;color:var(--mut);margin-top:2px}
.sr{color:var(--mut);font-size:13px;flex:none;font-weight:600}
.srow.danger b{color:#ff7a8a}
.tgl{width:46px;height:28px;border-radius:99px;background:var(--card2);position:relative;flex:none;transition:.2s}
.tgl:after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.tgl.on{background:linear-gradient(135deg,var(--a),var(--b))}.tgl.on:after{left:21px}
.swg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px}
.swt{background:none;border:2px solid transparent;border-radius:14px;padding:5px 3px;text-align:center;font-size:11px;color:var(--ink)}
.swt i{display:block;height:46px;border-radius:10px;margin-bottom:6px;border:1px solid var(--line)}
.swt.on{border-color:var(--b)}
.rcv{width:100%;max-width:340px;display:block;margin:8px auto 14px;border-radius:18px;border:1px solid var(--line);aspect-ratio:9/16;background:var(--surf)}
.rst{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 4px}
.rst div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center}.rst b{display:block;font-size:20px}.rst span{font-size:11px;color:var(--mut)}

.pgb{height:10px;border-radius:99px;background:var(--card2);overflow:hidden;margin:14px 0 8px}
.pgb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b));transition:width .2s}
.rsm{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:8px 14px 8px 8px;margin:0 0 14px;border-radius:14px;border:1px solid var(--line);background:var(--card2)}
.rsm img{width:52px;height:52px;border-radius:8px;object-fit:cover;flex:none}
.rsm b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rsm span{font-size:12px;color:var(--mut)}
.rsm .ic{color:var(--b);flex:none}
/* layar lebar */
@media(min-width:900px){
 .app{grid-template-columns:220px minmax(0,1fr) 410px}
 .side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:20px 12px;border-right:1px solid var(--line)}
 .bnav,.mini{display:none!important}
 .main{padding:24px 26px 40px;max-width:none;margin:0}
 .stage{position:sticky;inset:auto;top:16px;transform:none;visibility:visible;transition:none;height:calc(100vh - 32px);margin:16px 16px 16px 0;border-radius:28px;border:1px solid var(--line);overflow:hidden;background:#0a0a12;z-index:auto}
 #close{display:none}
 .toast{bottom:30px}
 .modal{align-items:center}.mbox{border-radius:22px;max-height:70vh}
}
@media(prefers-reduced-motion:reduce){.stage,.spin,.sk{transition:none;animation:none}}

/* ===== Penyegaran tampilan v11 (menimpa gaya di atas; ikut tema) ===== */
:root{--r1:22px;--r2:16px;--r3:12px;--ease:cubic-bezier(.2,.8,.2,1)}
body{font-feature-settings:"tnum" 1;letter-spacing:-.005em}
h1{font-size:29px;font-weight:800;letter-spacing:-.035em;line-height:1.1}
h2{font-size:18px;font-weight:750;letter-spacing:-.02em}
.gr{margin:4px 0 16px}
button{transition:transform .18s var(--ease),background-color .18s,color .18s,border-color .18s}
button:active{transform:scale(.96)}
/* navigasi: penanda aktif berbentuk pil di balik ikon */
.bnav{border-top:none;background:var(--nav);box-shadow:0 -1px 0 var(--line)}
.nb{gap:2px;font-size:11px;font-weight:650}
.nb .ic{width:52px;height:30px;border-radius:15px;align-items:center;justify-content:center;transition:background-color .22s var(--ease),color .22s}
.nb.on .ic{background:color-mix(in srgb,var(--a) 26%,transparent);color:var(--ink)}
.side .nb .ic{width:auto;height:auto;background:none!important}
/* mini player melayang */
.mini{left:10px;right:10px;border-radius:22px;padding:8px;background:var(--minibg);border:1px solid var(--line);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);box-shadow:0 12px 34px rgba(0,0,0,.38)}
.mini .main-b{border-radius:50%;box-shadow:0 4px 14px color-mix(in srgb,var(--a) 50%,transparent)}
/* pencarian dan chip */
.sbar{border-radius:20px;padding:14px 18px;background:var(--surf);border-color:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.chip{padding:9px 16px;font-weight:650;background:var(--card);border-color:transparent}
.chip.on{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;border-color:transparent}
/* kartu, cover, daftar */
.hero{border-radius:var(--r1);min-height:188px;padding:20px;border-color:transparent}
.hero .k{text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:700}
.hero .t{font-size:23px;letter-spacing:-.03em}
.pbtn{padding:11px 22px;box-shadow:0 6px 18px color-mix(in srgb,var(--a) 45%,transparent)}
.card{width:150px}
.card img,.card .sk,.pl .cv{width:150px;height:150px;border-radius:var(--r2);box-shadow:0 8px 20px rgba(0,0,0,.25)}
.ct{font-weight:650;letter-spacing:-.01em}
.sec{margin:26px 0 12px}
.sec button{font-weight:650}
.qp{gap:10px}
.qp button{border-radius:var(--r3);background:var(--card2)}
.qp img,.qp .cv,.qp .fv{border-radius:0}
.row{border-radius:var(--r2);padding:8px;background:transparent;border-color:transparent;transition:background-color .18s}
.row:hover,.row.now{background:var(--card);border-color:transparent}
.row.now .rt{color:var(--b)}
.row img{border-radius:var(--r3);width:88px;height:50px}
.rt{font-weight:650;letter-spacing:-.01em}
.srow{transition:background-color .18s}
.sgrp,.pcard,.set{border-radius:var(--r1)}
.modal,.sheet{border-radius:26px 26px 0 0}
:focus-visible{outline:2px solid var(--b);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><img src="/mascot.png" alt="">Alya Music</div>
    <nav id="snav"></nav>
    <button class="sbtn" id="srv" hidden style="margin-top:auto">Alamat server</button>
  </aside>
  <main class="main" id="main"></main>
  <aside class="stage" id="stage">
    <div class="sh">
      <button class="ib" id="close" aria-label="Tutup pemutar"></button>
      <div class="shl">Sedang diputar</div>
      <button class="tg on" id="t-auto">Otomatis</button>
      <button class="tg" id="t-shuf">Acak</button>
      <button class="tg" id="t-rep">Ulangi</button>
      <button class="ib" id="s-like" aria-label="Favorit"></button>
      <button class="ib" id="s-sl" aria-label="Timer tidur"></button>
      <button class="ib" id="s-q" aria-label="Antrean"></button>
    </div>
    <div class="fw">
      <iframe id="frame" title="Pemutar" allow="autoplay" hidden></iframe>
      <div class="ph" id="ph">Pilih lagu untuk mulai memutar.</div>
    </div>
  </aside>
</div>
<nav class="bnav" id="bnav"></nav>
<div class="mini" id="mini" hidden>
  <button class="mo" id="m-open" aria-label="Buka pemutar"><img id="m-img" alt=""><span style="min-width:0"><div class="mt" id="m-t"></div><div class="ma" id="m-a"></div></span></button>
  <button class="ib" id="m-prev" aria-label="Sebelumnya"></button>
  <button class="ib main-b" id="m-play" aria-label="Putar atau jeda"></button>
  <button class="ib" id="m-next" aria-label="Berikutnya"></button>
</div>
<div class="modal" id="modal" hidden><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast"></div>

<script>
(function () {
'use strict';
const $ = id => document.getElementById(id);
const h = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };
const P = {
  home: '<path d="M3 10.5 12 3l9 7.5V21H3z"/><path d="M9 21v-7h6v7"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  lib: '<path d="M4 6h16M4 12h16M4 18h9"/><path d="M17 15v5M14.5 17.5h5"/>',
  heart: '<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  dots: '<circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/>',
  play: '<path d="M8 5v14l11-7z"/>',
  pause: '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>',
  prev: '<path d="M6 6h2v12H6zM9.5 12 18 18V6z"/>',
  next: '<path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/>',
  shuffle: '<path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>',
  back: '<path d="M15 18l-6-6 6-6"/>',
  down: '<path d="M6 9l6 6 6-6"/>',
  trash: '<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
  edit: '<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  next2: '<path d="M5 6h9M5 12h9M5 18h5M17 14l4 3-4 3z"/>',
  music: '<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/>',

  share: '<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/>',
  friends: '<circle cx="9" cy="8" r="3.5"/><path d="M2 21c0-3.5 3-6 7-6s7 2.5 7 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14.5c3 0 5 2 5 4.5"/>',
  moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  up: '<path d="M18 15l-6-6-6 6"/>',
  chev: '<path d="M9 6l6 6-6 6"/>',
  ext: '<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14 21 3"/>'
};
const FILL = { play: 1, pause: 1, prev: 1, next: 1, dots: 1 };
const svg = (n, s) => '<svg width="' + (s || 22) + '" height="' + (s || 22) + '" viewBox="0 0 24 24" fill="' + (FILL[n] ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + P[n] + '</svg>';
const setIc = (el, n, s) => { el.innerHTML = svg(n, s); };
const ib = (n, label, fn, cls) => { const b = h('button', 'ib ' + (cls || '')); b.type = 'button'; b.setAttribute('aria-label', label); setIc(b, n); b.addEventListener('click', e => { e.stopPropagation(); fn(e); }); return b; };

// ---------- data ----------
const load = () => {
  try { const d = JSON.parse(localStorage.getItem('alya_v2') || 'null'); if (d && d.lists) return norm(d); } catch (e) {}
  let recent = []; try { recent = JSON.parse(localStorage.getItem('alya_recent') || '[]'); } catch (e) {}
  return { recent: recent.map(slim), likes: [], lists: [], gone: {}, favTs: 0, prefs: { auto: true, shuffle: false, repeat: false } };
};
function norm(d) { d.gone = d.gone || {}; d.favTs = d.favTs || 0; d.lists.forEach(l => { l.ts = l.ts || 0; }); d.prefs = d.prefs || { auto: true, shuffle: false, repeat: false }; return d; }
function slim(t) { return { id: t.id, title: t.title, author: t.author || '', duration: t.duration || '' }; }
let DB = load();
if (DB.prefs.rep == null) DB.prefs.rep = DB.prefs.repeat ? 1 : 0;
if (!DB.hist) DB.hist = []; if (!DB.log) DB.log = [];
const save = n => { try { localStorage.setItem('alya_v2', JSON.stringify(DB)); } catch (e) {} if (!n) queueSync(); };
const thumb = id => 'https://i.ytimg.com/vi/' + id + '/mqdefault.jpg';
const isLiked = id => DB.likes.some(t => t.id === id);
const uid = () => Math.random().toString(36).slice(2, 9);
function listOf(id) { return id === 'fav' ? { id: 'fav', name: 'Favorit', tracks: DB.likes, fav: true } : DB.lists.find(l => l.id === id); }
function addRecent(t) { DB.recent = [slim(t)].concat(DB.recent.filter(x => x.id !== t.id)).slice(0, 24); save(); }
function toggleLike(t) {
  DB.favTs = Date.now();
  if (isLiked(t.id)) { DB.likes = DB.likes.filter(x => x.id !== t.id); toast('Dihapus dari Favorit'); }
  else { DB.likes.unshift(slim(t)); toast('Ditambahkan ke Favorit'); }
  save(); paintLikes();
  if (V.v === 'lib' || V.v === 'list') render();
}
function addToList(lid, t) {
  if (lid === 'fav') { if (!isLiked(t.id)) toggleLike(t); else toast('Sudah ada di Favorit'); return; }
  const l = listOf(lid);
  if (l.tracks.some(x => x.id === t.id)) { toast('Sudah ada di ' + l.name); return; }
  l.tracks.push(slim(t)); l.ts = Date.now(); save(); toast('Ditambahkan ke ' + l.name);
  if (V.v === 'lib') render();
}
function removeFrom(lid, id) {
  if (lid === 'fav') { DB.likes = DB.likes.filter(x => x.id !== id); DB.favTs = Date.now(); }
  else { const l = listOf(lid); l.tracks = l.tracks.filter(x => x.id !== id); l.ts = Date.now(); }
  save(); paintLikes();
}

// ---------- umum ----------
let tt;
function toast(m) { const t = $('toast'); t.textContent = m; t.className = 'toast show'; clearTimeout(tt); tt = setTimeout(() => { t.className = 'toast'; }, 2200); }
function modal(title, build) {
  const b = $('mbox'); b.innerHTML = '';
  if (title) b.appendChild(h('div', 'mh', title));
  build(b); $('modal').hidden = false;
}
const closeModal = () => { $('modal').hidden = true; };
$('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
function act(box, text, fn, cls, icon) {
  const b = h('button', 'act ' + (cls || '')); b.type = 'button';
  if (icon) { const s = h('span', 'ic'); setIc(s, icon, 20); b.appendChild(s); }
  b.appendChild(h('span', '', text));
  b.addEventListener('click', () => { closeModal(); fn(); });
  box.appendChild(b);
}
function ask(title, value, okText, cb) {
  modal(title, box => {
    const i = h('input', 'minput'); i.value = value || ''; i.maxLength = 40; i.placeholder = 'Nama playlist'; box.appendChild(i);
    const r = h('div', 'brow'), c = h('button', '', 'Batal'), o = h('button', 'go', okText);
    c.onclick = closeModal;
    o.onclick = () => { const v = i.value.trim(); if (!v) return; closeModal(); cb(v); };
    i.addEventListener('keydown', e => { if (e.key === 'Enter') o.click(); });
    r.append(c, o); box.appendChild(r); setTimeout(() => i.focus(), 50);
  });
}
function confirmBox(title, okText, cb) {
  modal(title, box => {
    const r = h('div', 'brow'), c = h('button', '', 'Batal'), o = h('button', 'go', okText);
    c.onclick = closeModal; o.onclick = () => { closeModal(); cb(); };
    r.append(c, o); box.appendChild(r);
  });
}
function mosaic(tracks, cls) {
  const d = h('div', cls);
  if (!tracks.length) { const e = h('div', 'em'); setIc(e, 'music', 34); d.appendChild(e); return d; }
  const t4 = tracks.length >= 4 ? tracks.slice(0, 4) : [tracks[0]];
  t4.forEach(t => { const i = h('img', t4.length === 1 ? 'one' : ''); i.src = thumb(t.id); i.alt = ''; i.loading = 'lazy'; d.appendChild(i); });
  return d;
}

// ---------- pemutaran ----------
let queue = [], qi = -1, upNext = -1, fstate = 0, playing = false, errStreak = 0;
const media = { pos: 0, dur: 0, rate: 1, playing: false };
const frame = $('frame'), ph = $('ph');
const SPIN = '<div><div class="spin"></div>Menyiapkan lagu...</div>';
function pickNext() {
  if (!queue.length) return -1;
  if (DB.prefs.shuffle && queue.length > 1) { let r; do { r = Math.floor(Math.random() * queue.length); } while (r === qi); return r; }
  if (qi + 1 < queue.length) return qi + 1;
  return DB.prefs.repeat ? 0 : -1;
}
function playFrom(items, i) { queue = items.map(slim); go(i); }
function go(i) {
  if (i < 0 || i >= queue.length) return;
  qi = i; const t = queue[i];
  addRecent(t); upNext = pickNext(); pubNow(t);
  DB.log.push({ id: t.id, title: t.title, author: t.author || '', dur: t.duration || '', ts: Date.now() }); if (DB.log.length > 600) DB.log = DB.log.slice(-600); save(true);
  updMini(); paintLikes(); markNow();
  media.pos = 0; media.dur = 0; pushMedia();
  document.title = t.title + ' - Alya Music';
  if (fstate === 2) frame.contentWindow.postMessage({ type: 'alya-load', id: t.id, auto: true }, location.origin);
  else { fstate = 1; ph.className = 'ph'; ph.innerHTML = SPIN; frame.hidden = true; frame.src = '/player/' + encodeURIComponent(t.id) + '?auto=1'; }
}
const radioOn = () => DB.prefs.radio !== false;
let radioBusy = false;
async function radioMore() {
  if (radioBusy || !queue.length) return 0; radioBusy = true;
  try {
    const s0 = queue[qi] || queue[queue.length - 1], have = {};
    queue.forEach(t => { have[t.id] = 1; }); DB.log.slice(-40).forEach(t => { have[t.id] = 1; });
    const rs = await Promise.all([(s0.author ? s0.author + ' ' : '') + s0.title + ' mix', s0.author ? 'lagu seperti ' + s0.title : s0.title + ' playlist'].map(q => cached(q).catch(() => []))), out = [];
    for (let i = 0; i < 12; i++) rs.forEach(r2 => { const t = r2[i], d = t ? durS(t.duration) : 0; if (t && !have[t.id] && out.length < 10 && d < 600) { have[t.id] = 1; out.push(slim(t)); } });
    if (out.length) { queue = queue.concat(out); upNext = pickNext(); }
    return out.length;
  } catch (e) { return 0; } finally { radioBusy = false; }
}
function next() {
  if (upNext >= 0) go(upNext);
  else if (DB.prefs.auto && radioOn()) { toast('Mencari lagu serupa...'); radioMore().then(n => { if (n) go(qi + 1); else toast('Antrean selesai'); }); }
  else toast('Antrean selesai');
}
function prev() { if (media.pos > 3) { cmdPlayer({ cmd: 'seek', ms: 0 }); return; } if (qi > 0) go(qi - 1); }
frame.addEventListener('load', () => { ph.className = 'ph hide'; frame.hidden = false; });
window.addEventListener('message', e => {
  if (e.origin !== location.origin || e.source !== frame.contentWindow) return;
  const d = e.data; if (!d || typeof d !== 'object') return;
  if (d.type === 'alya-hello') { fstate = 2; sendAccent(); }
  else if (d.type === 'alya-state') { playing = !!d.playing; media.playing = playing; if (playing) errStreak = 0; setIc($('m-play'), playing ? 'pause' : 'play'); pushMedia(); }
  else if (d.type === 'alya-pos') {
    if (pendingSeek && d.dur > 0 && queue[qi] && queue[qi].id === pendingSeek.id) { const ms = Math.min(pendingSeek.ms + (pendingSeek.exact ? 0 : 2500), d.dur * 1000 - 3000); pendingSeek = null; if (ms > 3000) cmdPlayer({ cmd: 'seek', ms }); } media.pos = d.pos || 0; media.dur = d.dur || 0; saveResume(media.pos, media.dur); media.rate = d.rate || 1; media.playing = !!d.playing; pushMedia(); }
  else if (d.type === 'alya-ended') { if (DB.prefs.rep === 2) go(qi); else if (DB.prefs.auto) next(); }
  else if (d.type === 'alya-nav') { if (d.dir < 0) prev(); else next(); }
  else if (d.type === 'alya-near') { if (upNext < 0 && DB.prefs.auto && radioOn()) radioMore(); const n = queue[upNext]; if (n && DB.prefs.auto) fetch('/api/prefetch/' + encodeURIComponent(n.id)).catch(() => {}); }
  else if (d.type === 'alya-blocked') openSheet();
  else if (d.type === 'alya-error') { errStreak++; if (DB.prefs.auto && errStreak < 3) setTimeout(next, 1500); }
});
function updMini() {
  const t = queue[qi]; if (!t) return;
  $('mini').hidden = false; $('m-img').src = thumb(t.id); $('m-t').textContent = t.title; $('m-a').textContent = t.author;
}
function markNow() {
  const id = queue[qi] ? queue[qi].id : '';
  document.querySelectorAll('[data-id]').forEach(n => n.classList.toggle('now', n.dataset.id === id));
}
function paintLikes() {
  document.querySelectorAll('.like').forEach(b => b.classList.toggle('on', isLiked(b.dataset.lk)));
  const t = queue[qi], s = $('s-like'); s.classList.toggle('on', !!t && isLiked(t.id));
}
function cycleRep() { DB.prefs.rep = ((DB.prefs.rep || 0) + 1) % 3; DB.prefs.repeat = DB.prefs.rep > 0; toast(['Ulangi: mati', 'Ulangi semua lagu', 'Ulangi 1 lagu'][DB.prefs.rep]); }
function pushMode() { try { if (window.AlyaApp && AlyaApp.setMode) AlyaApp.setMode(!!DB.prefs.shuffle, DB.prefs.rep || 0); } catch (e) {} }
function paintToggles() {
  const rp = DB.prefs.rep || 0;
  $('t-auto').classList.toggle('on', DB.prefs.auto); $('t-shuf').classList.toggle('on', DB.prefs.shuffle);
  const tr = $('t-rep'); tr.classList.toggle('on', rp > 0); tr.textContent = rp === 2 ? 'Ulangi 1' : 'Ulangi'; pushMode();
}
['auto', 'shuf', 'rep'].forEach(k => $('t-' + k).addEventListener('click', () => {
  if (k === 'rep') cycleRep(); else { const key = { auto: 'auto', shuf: 'shuffle' }[k]; DB.prefs[key] = !DB.prefs[key]; } save(); paintToggles(); upNext = pickNext();
}));
$('s-like').addEventListener('click', () => { if (queue[qi]) toggleLike(queue[qi]); });

// ---------- navigasi ----------
let V = { v: 'home' };
const NAV = [['home', 'Beranda'], ['search', 'Cari'], ['lib', 'Playlist'], ['friends', 'Teman'], ['me', 'Saya']];
function buildNav() {
  [$('snav'), $('bnav')].forEach(box => NAV.forEach(([v, label]) => {
    const b = h('button', 'nb'); b.type = 'button'; b.dataset.nav = v;
    const s = h('span', 'ic'); setIc(s, v === 'me' ? 'user' : v, 22); b.append(s, h('span', '', label));
    b.onclick = () => setView(v); box.appendChild(b);
  }));
}
function updNav() { document.querySelectorAll('[data-nav]').forEach(b => b.classList.toggle('on', b.dataset.nav === (V.v === 'list' || V.v === 'colist' ? 'lib' : V.v === 'profile' ? 'friends' : V.v === 'recap' ? 'me' : V.v))); }
const stateObj = () => ({ v: V.v, id: V.id, sheet: document.body.classList.contains('sheet') ? 1 : 0 });
function setView(v, id) { V = { v, id }; history.pushState(stateObj(), ''); render(); window.scrollTo(0, 0); if (G.u && (v === 'friends' || v === 'lib')) gLoad(); }
function openSheet() { if (!document.body.classList.contains('sheet')) { document.body.classList.add('sheet'); history.pushState({ v: V.v, id: V.id, sheet: 1 }, ''); } }
function closeSheet() { if (!document.body.classList.contains('sheet')) return; if (history.state && history.state.sheet) history.back(); else document.body.classList.remove('sheet'); }
window.addEventListener('popstate', e => {
  const s = e.state || { v: 'home' };
  document.body.classList.toggle('sheet', !!s.sheet);
  if (s.v !== V.v || s.id !== V.id) { V = { v: s.v || 'home', id: s.id }; render(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); closeSheet(); } });
$('close').addEventListener('click', closeSheet); setIc($('close'), 'down');
$('m-open').addEventListener('click', openSheet);
setIc($('m-prev'), 'prev'); setIc($('m-next'), 'next'); setIc($('m-play'), 'play'); setIc($('s-like'), 'heart');
$('m-prev').addEventListener('click', prev); $('m-next').addEventListener('click', next);
$('m-play').addEventListener('click', () => { if (fstate === 2) frame.contentWindow.postMessage({ type: 'alya-cmd', cmd: 'toggle' }, location.origin); else openSheet(); });

// ---------- komponen ----------
function trackMenu(t, ctx) {
  modal(t.title, b => {
    act(b, 'Putar berikutnya', () => { if (qi < 0) playFrom([t], 0); else { queue.splice(qi + 1, 0, slim(t)); upNext = pickNext(); toast('Akan diputar berikutnya'); } }, '', 'next2');
    act(b, isLiked(t.id) ? 'Hapus dari Favorit' : 'Tambah ke Favorit', () => toggleLike(t), '', 'heart');
    act(b, 'Tambah ke playlist', () => pickList(t), '', 'plus');
    if (G.u) { act(b, 'Kirim ke teman', () => pickFriend(t), '', 'share'); act(b, 'Tambah ke playlist bersama', () => pickCol(t), '', 'list'); }
    act(b, 'Bagikan', () => { const txt = t.title + ' - ' + (t.author || '') + ' https://youtu.be/' + t.id; if (window.AlyaApp && AlyaApp.share) AlyaApp.share(txt); else if (navigator.share) navigator.share({ text: txt }).catch(() => {}); else toast('Berbagi tidak didukung'); }, '', 'share');

const ghReq = (path, method, body) => fetch('https://api.github.com' + path, { method: method || 'GET', headers: { Authorization: 'Bearer ' + tok(), Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
const snap = () => ({ v: 2, lists: DB.lists, likes: DB.likes, favTs: DB.favTs || 0, gone: DB.gone || {}, recent: DB.recent.slice(0, 24) });
function mergeIn(r) {
  if (!r || !Array.isArray(r.lists)) return false;
  const before = JSON.stringify(snap());
  const gone = Object.assign({}, DB.gone); Object.keys(r.gone || {}).forEach(k => { gone[k] = Math.max(gone[k] || 0, r.gone[k]); });
  const map = {}; DB.lists.concat(r.lists).forEach(l => { const o = map[l.id]; if (!o || (l.ts || 0) > (o.ts || 0)) map[l.id] = l; });
  DB.lists = Object.keys(map).map(k => map[k]).filter(l => !(gone[l.id] && gone[l.id] >= (l.ts || 0)));
  DB.gone = gone;
  if ((r.favTs || 0) > (DB.favTs || 0)) { DB.likes = r.likes || []; DB.favTs = r.favTs; }
  const seen = {}; DB.recent = DB.recent.concat(r.recent || []).filter(t => !seen[t.id] && (seen[t.id] = 1)).slice(0, 24);
  return JSON.stringify(snap()) !== before;
}
let syncing = false, syncT, syncMsg = '';
function queueSync() { if (G.u) gQueue(); if (!tok()) return; clearTimeout(syncT); syncT = setTimeout(() => syncNow(true), 4000); }
async function syncNow(silent) {
  if (!tok() || syncing) return;
  syncing = true;
  try {
    let id = localStorage.getItem(GID) || '', remote = '';
    if (!id) {
      const r = await ghReq('/gists?per_page=100');
      if (!r.ok) throw new Error('Token ditolak (' + r.status + ')');
      const g = (await r.json()).find(x => x.files && x.files[GFILE]); if (g) id = g.id;
    }
    if (id) {
      const r = await ghReq('/gists/' + id);
      if (r.status === 404) { id = ''; localStorage.removeItem(GID); }
      else if (!r.ok) throw new Error('Gagal membaca (' + r.status + ')');
      else {
        const f = (await r.json()).files[GFILE];
        remote = f ? f.content : '';
        if (f && f.truncated) remote = await (await fetch(f.raw_url)).text();
        if (remote) mergeIn(JSON.parse(remote));
      }
    }
    const content = JSON.stringify(snap());
    if (!id || content !== remote) {
      const body = { description: 'Alya Music sync', files: { [GFILE]: { content } } };
      const w = id ? await ghReq('/gists/' + id, 'PATCH', body) : await ghReq('/gists', 'POST', Object.assign({ public: false }, body));
      if (!w.ok) throw new Error('Gagal menyimpan (' + w.status + ')');
      if (!id) localStorage.setItem(GID, (await w.json()).id);
    }
    save(true); localStorage.setItem('alya_sync_at', String(Date.now())); syncMsg = 'Tersinkron';
    if (!silent) toast('Tersinkron');
    if (V.v === 'home' || V.v === 'lib' || V.v === 'me' || V.v === 'list') render();
  } catch (e) { syncMsg = 'Gagal: ' + (e.message || e); if (!silent) toast(syncMsg); }
  syncing = false;
}

    .then(r => { if (!r.ok) throw new Error('Token tidak valid'); return r.json(); })
    .then(u => { localStorage.setItem(TOK, t); localStorage.setItem('alya_user', u.login); localStorage.removeItem(GID); render(); syncNow(false); })
    .catch(e => toast(e.message || 'Gagal masuk'));
}

// ---------- diagnostik pemutaran ----------
function diagBox(m) {
  const g = sgrp(m, 'Diagnostik pemutaran');
  const fill = () => {
    g.textContent = '';
    srow(g, 'Mengukur...', 'Memuat data pemutaran');
    fetch('/api/diag').then(r => r.json()).then(d => {
      g.textContent = '';
      const rep = [];
      const add = (t, sub) => { srow(g, t, sub); rep.push(t + ': ' + sub); };
      add('Ekstraktor', 'NewPipeExtractor ' + (d.extractor || '?') + (d.npFail ? ' · gagal ' + d.npFail + 'x, cadangan dipakai ' + d.pipedUsed + 'x' : ''));
      if (d.lastErr) add('Galat terakhir', String(d.lastErr).slice(0, 140));
      if (!d.id) { srow(g, 'Belum ada lagu', 'Putar satu lagu, lalu buka halaman ini lagi'); }
      else {
        const kb = d.kbps > 0 ? d.kbps + ' kbps' : 'bitrate tidak diketahui';
        add('Lagu', d.title || d.id);
        add('Sumber audio', d.src === 'Piped' ? 'Piped (cadangan)' : 'NewPipe (utama)');
        add('Format', (d.mime || '?') + ' · ' + kb);
        add('Respons server', d.ttfb + ' ms' + (d.ttfb > 3000 ? ' · lambat' : ''));
        let v = 'Belum terukur (tunggu lagu terisi buffer)';
        if (d.initKbps > 0) {
          const need = d.kbps > 0 ? d.kbps : 96;
          v = d.initKbps + ' kbps · ' + (d.initKbps < need * 1.5 ? 'LAMBAT, kemungkinan dibatasi' : d.initKbps < need * 4 ? 'cukup' : 'lancar');
        }
        add('Kecepatan unduh awal', v);
        add('Permintaan', d.reqs + ' kali' + (d.errs ? ' · ' + d.errs + ' ditolak' : '') + ' · alamat berlaku ±' + d.ageMin + ' mnt');
      }
      srow(g, 'Muat ulang', 'Perbarui angka di atas', fill);
      srow(g, 'Salin laporan', 'Tempel ke chat untuk dianalisis', () => { const t = rep.join('\n'); if (window.AlyaApp && AlyaApp.copy) AlyaApp.copy(t); else if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => toast('Disalin')); });
    }).catch(() => { g.textContent = ''; srow(g, 'Tidak bisa memuat', 'Server internal tidak menjawab', fill); });
  };
  fill();
}

  const st = h('div', 'rst'); [[d.total, 'Lagu diputar'], [d.nArt, 'Artis'], [d.mins ? d.mins + ' mnt' : '-', 'Perkiraan durasi']].forEach(([n, l]) => { const c = h('div'); c.append(h('b', '', String(n)), h('span', '', l)); st.appendChild(c); }); m.appendChild(st);
  const cv = h('canvas', 'rcv'); cv.width = 1080; cv.height = 1920; m.appendChild(cv); paintRecap(cv, d, RR);
  const a = h('div', 'acts'); a.style.justifyContent = 'center'; m.appendChild(a);
  const txt = 'Rekap Alya Music: ' + d.total + ' lagu diputar. Teratas: ' + d.tracks.slice(0, 3).map(o => o.t.title).join(', ') + '.';
  btn(a, 'Bagikan gambar', () => {
    try {
      const url = cv.toDataURL('image/png');
      if (window.AlyaApp && AlyaApp.shareImage) AlyaApp.shareImage(url.split(',')[1], txt);
      else { const l = document.createElement('a'); l.href = url; l.download = 'alya-rekap.png'; l.click(); }
    } catch (e) { toast('Gagal membuat gambar'); }
  }, 'pbtn');
  btn(a, 'Bagikan teks', () => { if (window.AlyaApp && AlyaApp.share) AlyaApp.share(txt); else if (navigator.clipboard) navigator.clipboard.writeText(txt).then(() => toast('Disalin')); });
  sec(m, 'Lagu teratas'); const items = d.tracks.map(o => slim(o.t)), ls = h('div', 'list'); items.forEach((t, i) => ls.appendChild(row(t, items, i))); m.appendChild(ls);
}

// ---------- antrean ----------
function qmove(i, d) { const j = i + d; if (j < 0 || j >= queue.length) return; const t = queue[i]; queue[i] = queue[j]; queue[j] = t; if (qi === i) qi = j; else if (qi === j) qi = i; upNext = pickNext(); openQueue(); }
function openQueue() {
  if (!queue.length) { toast('Antrean kosong'); return; }
  modal('Antrean (' + queue.length + ')', bx => {
    const sv = h('button', 'sbtn', 'Simpan sebagai playlist'); sv.type = 'button'; sv.style.marginBottom = '8px';
    sv.onclick = () => { closeModal(); ask('Simpan antrean', 'Antrean ' + new Date().toLocaleDateString('id-ID'), 'Simpan', n => { DB.lists.push({ id: uid(), name: n, tracks: queue.map(slim), ts: Date.now() }); save(); toast('Playlist disimpan'); }); };
    bx.appendChild(sv);
    queue.forEach((t, i) => {
      const r = h('div', 'qrow' + (i === qi ? ' cur' : ''));
      const b = h('button', 'act', (i === qi ? '▶ ' : (i + 1) + '. ') + t.title); b.type = 'button';
      b.onclick = () => { closeModal(); go(i); };
      r.append(b, ib('up', 'Naik', () => qmove(i, -1)), ib('down', 'Turun', () => qmove(i, 1)));
      if (i !== qi) r.appendChild(ib('trash', 'Hapus dari antrean', () => { queue.splice(i, 1); if (i < qi) qi--; upNext = pickNext(); openQueue(); }));
      bx.appendChild(r);
    });
  });
}
let sleepT = null, sleepEnd = 0;
function setSleep(min) {
  clearTimeout(sleepT); sleepT = null; sleepEnd = 0;
  if (min) { sleepEnd = Date.now() + min * 6e4; sleepT = setTimeout(() => { cmdPlayer({ cmd: 'pause' }); sleepT = null; sleepEnd = 0; $('s-sl').classList.remove('on'); toast('Timer tidur selesai, musik dijeda'); }, min * 6e4); toast('Musik berhenti dalam ' + min + ' menit'); }
  $('s-sl').classList.toggle('on', !!min);
}
setIc($('s-sl'), 'moon');
$('s-sl').addEventListener('click', () => modal('Timer tidur' + (sleepEnd ? ' (sisa ' + Math.ceil((sleepEnd - Date.now()) / 6e4) + ' mnt)' : ''), b => { [15, 30, 45, 60].forEach(n => act(b, n + ' menit', () => setSleep(n), '', 'moon')); if (sleepEnd) act(b, 'Matikan timer', () => setSleep(0), 'danger', 'trash'); }));
const THEMES = [
  { n: 'Malam', a: '#8b5cf6', b: '#22d3ee', bg: '#0a0a12' }, { n: 'AMOLED', a: '#a78bfa', b: '#38bdf8', bg: '#000000' },
  { n: 'Samudra', a: '#3b82f6', b: '#06b6d4', bg: '#06101c' }, { n: 'Hutan', a: '#10b981', b: '#84cc16', bg: '#07120e' },
  { n: 'Senja', a: '#f97316', b: '#ec4899', bg: '#150b0b' }, { n: 'Mawar', a: '#ec4899', b: '#f59e0b', bg: '#14090f' },
  { n: 'Terang', a: '#7c3aed', b: '#0891b2', bg: '#f6f6fb', light: 1 }];
const hx = c => [1, 3, 5].map(i => parseInt(c.substr(i, 2), 16));
const mixc = (c1, c2, t, al) => { const x = hx(c1), y = hx(c2), v = x.map((n, i) => Math.round(n + (y[i] - n) * t)).join(','); return al ? 'rgba(' + v + ',' + al + ')' : 'rgb(' + v + ')'; };
let ACC = { a: '#8b5cf6', b: '#22d3ee' };
const themeIdx = () => { let n = 0; try { n = Number(localStorage.getItem('alya_theme') || 0); } catch (e) {} return THEMES[n] ? n : 0; };
function sendAccent() { try { if (fstate === 2) frame.contentWindow.postMessage({ type: 'alya-accent', a: ACC.a, b: ACC.b }, location.origin); } catch (e) {} }
function applyTheme(i) {
  const t = THEMES[i] || THEMES[0], L = !!t.light, st = document.documentElement.style, up = L ? '#000000' : '#ffffff', set = (k, v) => st.setProperty(k, v);
  set('--a', t.a); set('--b', t.b); set('--bg', t.bg);
  set('--ink', L ? '#14141f' : '#f5f5fb'); set('--mut', L ? 'rgba(20,20,31,.62)' : 'rgba(245,245,251,.62)');
  set('--card', L ? 'rgba(0,0,0,.05)' : 'rgba(255,255,255,.06)'); set('--card2', L ? 'rgba(0,0,0,.09)' : 'rgba(255,255,255,.1)'); set('--line', L ? 'rgba(0,0,0,.1)' : 'rgba(255,255,255,.1)');
  set('--surf', L ? '#ffffff' : mixc(t.bg, up, .07)); set('--surf2', L ? '#e9e9f1' : mixc(t.bg, up, .11));
  set('--nav', L ? 'rgba(255,255,255,.96)' : mixc(t.bg, up, .04, .96)); set('--modal', L ? '#ffffff' : mixc(t.bg, up, .08)); set('--inp', L ? '#f0f0f6' : mixc(t.bg, up, .05));
  set('--toastbg', L ? '#14141f' : mixc(t.bg, up, .14)); set('--minibg', L ? 'rgba(255,255,255,.97)' : mixc(t.bg, up, .09, .95));
  ACC = { a: t.a, b: t.b };
  try { document.querySelector('meta[name=theme-color]').setAttribute('content', t.bg); } catch (e) {}
  try { if (window.AlyaApp && AlyaApp.setBars) AlyaApp.setBars(t.bg, L); } catch (e) {}
  sendAccent();
}
applyTheme(themeIdx());
setInterval(() => {
  if (!G.u || document.hidden) return; const ae = document.activeElement; if (ae && ae.tagName === 'INPUT') return;
  if (V.v === 'colist' && G.cur && !G.cur.bad && G.cur.id === V.id) { const prev = G.cur, bf = JSON.stringify(prev); colLoad(V.id).then(() => { if (G.cur.bad) { G.cur = prev; return; } if (V.v === 'colist' && JSON.stringify(G.cur) !== bf) render(); }); }
  else if (['home', 'friends', 'lib'].indexOf(V.v) >= 0) gLoad();
}, 20000);
setIc($('s-q'), 'list'); $('s-q').addEventListener('click', openQueue);

buildNav(); paintToggles();
history.replaceState({ v: 'home' }, '');
if (window.AlyaApp && typeof AlyaApp.changeServer === 'function') { $('srv').hidden = false; $('srv').onclick = () => AlyaApp.changeServer(); }
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
render();
if (window.AlyaApp) setTimeout(() => checkUpdate(false), 800);
if (tok()) setTimeout(() => syncNow(true), 1500);
if (G.u) setTimeout(() => { gSync(); gLoad(); }, 1200);
})();
