plugins {
    id 'com.android.application'
}
def githubRunNumber = System.getenv("GITHUB_RUN_NUMBER") ?: "1"
def autoVersionCode = githubRunNumber.toInteger()
def autoVersionName = "v" + githubRunNumber

def cfg(k) { System.getenv(k) ?: (project.findProperty(k) ?: '') }

android {
    namespace 'com.alya.music'
    compileSdk 34
    
    buildFeatures {
        buildConfig = true
    }
    
    defaultConfig {
        applicationId 'com.alya.music'
        minSdk 24
        targetSdk 34
        
        versionCode autoVersionCode
        versionName autoVersionName
        
        buildConfigField "String", "REPO", "\"yuusuke1101/alyamusic\""
        buildConfigField "String", "WEB_CLIENT_ID", "\"${cfg('ALYA_WEB_CLIENT_ID')}\""
        buildConfigField "String", "FB_KEY", "\"${cfg('ALYA_FB_KEY')}\""
        buildConfigField "String", "FB_PROJECT", "\"${cfg('ALYA_FB_PROJECT')}\""
    }
    
    signingConfigs {
        alya {
            storeFile file('alya.keystore')
            storePassword cfg('ALYA_STORE_PASS')
            keyAlias cfg('ALYA_KEY_ALIAS') ?: 'alya'
            keyPassword cfg('ALYA_KEY_PASS') ?: cfg('ALYA_STORE_PASS')
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.alya }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    
    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/INDEX.LIST', 'META-INF/*.kotlin_module']
        }
    }
}

dependencies {
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.0.4'
    
    // Ini adalah kode yang dipindahkan dari compileOptions
    implementation 'androidx.activity:activity:1.8.0'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
