name: Cek update NewPipeExtractor
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bandingkan versi
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/TeamNewPipe/NewPipeExtractor/releases/latest --jq .tag_name)
          current=$(grep -o "NewPipeExtractor:v[0-9.]*" app/build.gradle | head -1 | cut -d: -f2)
          echo "terpasang=$current terbaru=$latest"
          if [ -n "$latest" ] && [ "$latest" != "$current" ]; then
            title="Update NewPipeExtractor ke $latest"
            existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq 'length')
            if [ "$existing" = "0" ]; then
              gh issue create --title "$title" --body "Terpasang: $current. Rilis terbaru: $latest. Ganti versi di app/build.gradle, bangun, lalu tes cari + putar lagu. Catatan rilis: https://github.com/TeamNewPipe/NewPipeExtractor/releases/tag/$latest"
            fi
          fi
